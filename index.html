<title>東暦標準時時計 & カレンダー</title>

<style>
:root {
  --bg-dark: #0b0f19;
  --panel-bg: rgba(22, 30, 46, 0.7);
  --accent-cyan: #00f2ff;
  --accent-gold: #ffb703;
  --accent-red: #ff3366;
  --accent-purple: #a855f7;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background-color: var(--bg-dark);
  background-image: 
    radial-gradient(circle at 50% 20%, rgba(0, 242, 255, 0.08) 0%, transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(168, 85, 247, 0.06) 0%, transparent 40%);
  color: #e2e8f0;
  font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
  overflow-x: hidden;
}

.mono-font {
  font-family: 'Share Tech Mono', monospace;
}

.tech-font {
  font-family: 'Chakra Petch', sans-serif;
}

.glass-panel {
  background: var(--panel-bg);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
}

/*==============================
アナログ時計
==============================*/

.clock-outer {
  position: relative;
  width: min(340px, 72vw);
  height: min(340px, 72vw);
  margin: 0 auto;
  border-radius: 50%;
  background: radial-gradient(circle, #1a233a 0%, #0d1322 100%);
  border: 2px solid rgba(0, 242, 255, 0.3);
  box-shadow: 
    0 0 30px rgba(0, 242, 255, 0.15),
    inset 0 0 25px rgba(0, 0, 0, 0.8);
}

.clock-number {
  position: absolute;
  width: 26px;
  height: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 700;
  font-family: 'Chakra Petch', sans-serif;
  color: #94a3b8;
  transform: translate(-50%, -50%);
  user-select: none;
}

.clock-number.major {
  color: var(--accent-cyan);
  font-size: 12px;
  text-shadow: 0 0 8px rgba(0, 242, 255, 0.6);
}

/* 針の指定 */
.hand {
  position: absolute;
  left: 50%;
  bottom: 50%;
  transform-origin: 50% 100%;
  border-radius: 4px;
  transform: translateX(-50%) rotate(0deg);
  transition: transform 0.05s cubic-bezier(0.4, 2.08, 0.55, 0.44);
}

.hour-hand {
  width: 6px;
  height: 28%;
  background: linear-gradient(to top, var(--accent-cyan), #ffffff);
  box-shadow: 0 0 10px rgba(0, 242, 255, 0.5);
  z-index: 3;
}

.minute-hand {
  width: 4px;
  height: 38%;
  background: linear-gradient(to top, #94a3b8, #ffffff);
  z-index: 4;
}

.second-hand {
  width: 2px;
  height: 44%;
  background: var(--accent-red);
  box-shadow: 0 0 8px rgba(255, 51, 102, 0.8);
  z-index: 5;
}

.center-dot {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 14px;
  height: 14px;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: var(--accent-red);
  box-shadow: 0 0 10px rgba(255, 51, 102, 0.8);
  border: 2px solid #ffffff;
  z-index: 6;
}

.tick-mark {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 2px;
  height: 6px;
  background: rgba(255, 255, 255, 0.2);
  transform-origin: 50% 0%;
}

.tick-mark.major {
  height: 10px;
  width: 2px;
  background: var(--accent-cyan);
}

.glow-text {
  text-shadow: 0 0 12px rgba(0, 242, 255, 0.5);
}

/* カレンダーセル */
.cal-day-cell {
  aspect-ratio: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border-radius: 0.75rem;
  border: 1px solid rgba(255, 255, 255, 0.05);
  background: rgba(15, 23, 42, 0.4);
  transition: all 0.2s ease;
}

.cal-day-cell.today {
  border-color: var(--accent-cyan);
  background: rgba(0, 242, 255, 0.15);
  box-shadow: 0 0 12px rgba(0, 242, 255, 0.3);
  font-weight: bold;
  color: #ffffff;
}

.cal-day-cell.other-month {
  opacity: 0.25;
}
</style>
</head>

  <!-- コントロールパネル -->

        <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        標準時帯 (WST)

      <select id="timezone" class="bg-slate-900/90 border border-slate-700 text-cyan-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-cyan-400 transition-colors cursor-pointer">
        <option value="0">和音陣国 — WST±0</option>

        <button data-mode="both" class="mode-btn px-3 py-1 text-xs rounded-lg transition-all bg-cyan-500/20 text-cyan-300 border border-cyan-500/30">両方</button>
        <button data-mode="analog" class="mode-btn px-3 py-1 text-xs text-slate-400 hover:text-slate-200 transition-all">アナログ</button>
        <button data-mode="digital" class="mode-btn px-3 py-1 text-xs text-slate-400 hover:text-slate-200 transition-all">デジタル</button>

  <!-- 時差情報 -->

<script>
/*============================================================
東暦設定定数
============================================================*/

// 基準となる現実（JST）の日時：2026-04-19T13:00:00+09:00 = 東暦2045年1月1日 00:00:00 (天曜日)
const BASE_JST = new Date("2026-04-19T13:00:00+09:00");
const BASE_YEAR = 2045;

// 東暦の時間構造 (29時間 / 145分 / 145秒)
const EAST_HOURS = 29;
const EAST_MINUTES = 145;
const EAST_SECONDS = 145;

// 曜日の定義 (1週間は7日: 天 -> 知 -> 人 -> 和 -> 駿 -> 律 -> 水)
const DAYS_OF_WEEK = ["天", "知", "人", "和", "駿", "律", "水"];

// 1東暦日の総東暦秒 (29 * 145 * 145 = 609,725秒)
const EAST_SECONDS_PER_DAY = EAST_HOURS * EAST_MINUTES * EAST_SECONDS;

// 東暦1日が現実時間で進む秒数 (25時間31分2秒 = 91,862現実秒)
const REAL_SECONDS_PER_EAST_DAY = (25 * 3600) + (31 * 60) + 2;

// 東暦1時間に対応する経度
const LONGITUDE_PER_HOUR = 360 / EAST_HOURS;

// カレンダーの現在表示年月
let viewCalendarYear = BASE_YEAR;
let viewCalendarMonth = 1;


/*============================================================
暦関数
============================================================*/

function daysInMonth(month) {
  // 1月: 31日, 3月: 33日, 6月: 34日, 10月: 19日, その他: 35日
  if (month === 1) return 31;
  if (month === 3) return 33;
  if (month === 6) return 34;
  if (month === 10) return 19;
  return 35;
}

function daysInYear() {
  let total = 0;
  for (let month = 1; month <= 15; month++) {
    total += daysInMonth(month);
  }
  return total;
}

// 2045年1月1日からの累計東暦日数を計算
function getEastTotalDays(year, month, day) {
  let total = (year - BASE_YEAR) * daysInYear();
  for (let m = 1; m < month; m++) {
    total += daysInMonth(m);
  }
  total += (day - 1);
  return total;
}

// 特定の年月日の曜日インデックスを取得 (0:天, 1:知, ..., 6:水)
function getEastDayOfWeekIndex(year, month, day) {
  const totalDays = getEastTotalDays(year, month, day);
  return ((totalDays % 7) + 7) % 7;
}


/*============================================================
東暦日時計算関数
============================================================*/

function getEastDate(now, timezoneOffset) {
  const realElapsedSeconds = (now.getTime() - BASE_JST.getTime()) / 1000;
  const eastElapsedSeconds = realElapsedSeconds * (EAST_SECONDS_PER_DAY / REAL_SECONDS_PER_EAST_DAY);

  let totalDays = Math.floor(eastElapsedSeconds / EAST_SECONDS_PER_DAY);
  let remainingSeconds = eastElapsedSeconds - (totalDays * EAST_SECONDS_PER_DAY);

  if (remainingSeconds < 0) {
    remainingSeconds += EAST_SECONDS_PER_DAY;
    totalDays -= 1;
  }

  let year = BASE_YEAR;
  const daysPerYear = daysInYear();

  while (totalDays >= daysPerYear) {
    totalDays -= daysPerYear;
    year++;
  }
  while (totalDays < 0) {
    totalDays += daysPerYear;
    year--;
  }

  let month = 1;
  while (totalDays >= daysInMonth(month)) {
    totalDays -= daysInMonth(month);
    month++;
  }

  let day = Math.floor(totalDays) + 1;

  const secondsPerHour = EAST_MINUTES * EAST_SECONDS;
  let hour = Math.floor(remainingSeconds / secondsPerHour);
  remainingSeconds -= hour * secondsPerHour;

  const minute = Math.floor(remainingSeconds / EAST_SECONDS);
  const second = Math.floor(remainingSeconds % EAST_SECONDS);
  const secondFraction = remainingSeconds - Math.floor(remainingSeconds);

  // タイムゾーン適用
  hour += timezoneOffset;

  if (hour < 0) {
    hour += EAST_HOURS;
    day--;
    if (day < 1) {
      month--;
      if (month < 1) {
        month = 15;
        year--;
      }
      day = daysInMonth(month);
    }
  } else if (hour >= EAST_HOURS) {
    hour -= EAST_HOURS;
    day++;
    if (day > daysInMonth(month)) {
      day = 1;
      month++;
      if (month > 15) {
        month = 1;
        year++;
      }
    }
  }

  const dayOfWeekIndex = getEastDayOfWeekIndex(year, month, day);

  return {
    year,
    month,
    day,
    hour,
    minute,
    second,
    secondFraction,
    dayOfWeekIndex,
    dayOfWeekName: DAYS_OF_WEEK[dayOfWeekIndex]
  };
}


/*============================================================
アナログ時計の盤面初期化
============================================================*/

const clock = document.getElementById("analog");

for (let i = 0; i < EAST_HOURS; i++) {
  const angle = (i * 360) / EAST_HOURS;
  const angleRad = (angle * Math.PI) / 180;

  const tick = document.createElement("div");
  tick.className = `tick-mark ${i % 5 === 0 ? 'major' : ''}`;
  tick.style.transform = `translate(-50%, -100%) rotate(${angle}deg) translateY(-${clock.clientWidth / 2 - 12}px)`;
  clock.appendChild(tick);

  const number = document.createElement("div");
  number.className = `clock-number ${i % 5 === 0 ? 'major' : ''}`;
  
  const radius = 40; 
  const x = 50 + radius * Math.sin(angleRad);
  const y = 50 - radius * Math.cos(angleRad);

  number.style.left = `${x}%`;
  number.style.top = `${y}%`;
  number.textContent = i;

  clock.appendChild(number);
}


/*============================================================
カレンダー描画
============================================================*/

function renderCalendar(currentEastDate) {
  const grid = document.getElementById("calendarGrid");
  grid.innerHTML = "";

  document.getElementById("calendarTitle").textContent = `東暦${viewCalendarYear}年 ${viewCalendarMonth}月`;

  // 1日の曜日を取得
  const firstDayIndex = getEastDayOfWeekIndex(viewCalendarYear, viewCalendarMonth, 1);
  const totalDays = daysInMonth(viewCalendarMonth);

  // 1日より前の空欄埋め
  for (let i = 0; i < firstDayIndex; i++) {
    const emptyCell = document.createElement("div");
    emptyCell.className = "cal-day-cell opacity-0 pointer-events-none";
    grid.appendChild(emptyCell);
  }

  // 月の日数をレンダリング
  for (let day = 1; day <= totalDays; day++) {
    const dayCell = document.createElement("div");
    const dayOfWeekIdx = (firstDayIndex + (day - 1)) % 7;
    
    let isToday = (
      currentEastDate.year === viewCalendarYear &&
      currentEastDate.month === viewCalendarMonth &&
      currentEastDate.day === day
    );

    dayCell.className = `cal-day-cell p-2 ${isToday ? 'today' : 'hover:bg-slate-800/60'}`;

    const numSpan = document.createElement("span");
    numSpan.className = "text-sm font-semibold";
    numSpan.textContent = day;

    dayCell.appendChild(numSpan);
    grid.appendChild(dayCell);
  }
}


/*============================================================
時計表示更新
============================================================*/

function updateClock() {
  const now = new Date();
  const timezone = Number(document.getElementById("timezone").value);
  const east = getEastDate(now, timezone);

  // デジタル時計
  const formattedHour = String(east.hour).padStart(2, "0");
  const formattedMinute = String(east.minute).padStart(3, "0");
  const formattedSecond = String(east.second).padStart(3, "0");

  document.getElementById("digital").textContent = 
    `${formattedHour}:${formattedMinute}:${formattedSecond}`;

  // 日付・曜日表記
  document.getElementById("date").textContent = 
    `東暦${east.year}年 ${east.month}月 ${east.day}日`;
  document.getElementById("dayOfWeek").textContent = `(${east.dayOfWeekName})`;

  // アナログ時計の針
  const hourAngle = (east.hour + east.minute / EAST_MINUTES + east.second / (EAST_MINUTES * EAST_SECONDS)) * (360 / EAST_HOURS);
  const minuteAngle = (east.minute + east.second / EAST_SECONDS) * (360 / EAST_MINUTES);
  const secondAngle = (east.second + east.secondFraction) * (360 / EAST_SECONDS);

  document.getElementById("hourHand").style.transform = `translateX(-50%) rotate(${hourAngle}deg)`;
  document.getElementById("minuteHand").style.transform = `translateX(-50%) rotate(${minuteAngle}deg)`;
  document.getElementById("secondHand").style.transform = `translateX(-50%) rotate(${secondAngle}deg)`;

  // 時差情報
  const longitude = timezone * LONGITUDE_PER_HOUR;
  const japanDifference = timezone + 2;

  document.getElementById("timezoneInfo").innerHTML = `
    <div class="p-2 rounded-xl bg-slate-900/60 border border-slate-800">
      <div class="text-slate-500 text-xs">現在タイムゾーン</div>
      <div class="text-cyan-300 font-semibold tech-font mt-0.5">WST ${timezone >= 0 ? "+" : ""}${timezone}</div>
    </div>
    <div class="p-2 rounded-xl bg-slate-900/60 border border-slate-800">
      <div class="text-slate-500 text-xs">日本(JST)との差</div>
      <div class="text-slate-200 font-semibold tech-font mt-0.5">${japanDifference >= 0 ? "+" : ""}${japanDifference} 時間</div>
    </div>
    <div class="p-2 rounded-xl bg-slate-900/60 border border-slate-800">
      <div class="text-slate-500 text-xs">基準子午線経度差</div>
      <div class="text-slate-200 font-semibold tech-font mt-0.5">${longitude >= 0 ? "+" : ""}${longitude.toFixed(2)}°</div>
    </div>
  `;

  renderCalendar(east);
}


/*============================================================
イベントリスナー設定
============================================================*/

// カレンダーナビゲーション
document.getElementById("prevMonthBtn").addEventListener("click", () => {
  viewCalendarMonth--;
  if (viewCalendarMonth < 1) {
    viewCalendarMonth = 15;
    viewCalendarYear--;
  }
});

document.getElementById("nextMonthBtn").addEventListener("click", () => {
  viewCalendarMonth++;
  if (viewCalendarMonth > 15) {
    viewCalendarMonth = 1;
    viewCalendarYear++;
  }
});

document.getElementById("todayBtn").addEventListener("click", () => {
  const now = new Date();
  const timezone = Number(document.getElementById("timezone").value);
  const east = getEastDate(now, timezone);
  viewCalendarYear = east.year;
  viewCalendarMonth = east.month;
});

// 表示モード切替
const analogArea = document.getElementById("analogArea");
const digitalArea = document.getElementById("digitalArea");
const modeButtons = document.querySelectorAll("#viewModeSelector button");

modeButtons.forEach(btn => {
  btn.addEventListener("click", () => {
    const mode = btn.getAttribute("data-mode");

    modeButtons.forEach(b => {
      b.className = "mode-btn px-3 py-1 text-xs text-slate-400 hover:text-slate-200 transition-all";
    });
    btn.className = "mode-btn px-3 py-1 text-xs rounded-lg transition-all bg-cyan-500/20 text-cyan-300 border border-cyan-500/30";

    if (mode === "both") {
      analogArea.classList.remove("hidden");
      digitalArea.classList.remove("hidden");
    } else if (mode === "analog") {
      analogArea.classList.remove("hidden");
      digitalArea.classList.add("hidden");
    } else if (mode === "digital") {
      analogArea.classList.add("hidden");
      digitalArea.classList.remove("hidden");
    }
  });
});

document.getElementById("timezone").addEventListener("change", updateClock);


/*============================================================
メインアニメーションループ
============================================================*/

function loop() {
  updateClock();
  requestAnimationFrame(loop);
}

// 初期化表示処理
const initEast = getEastDate(new Date(), Number(document.getElementById("timezone").value));
viewCalendarYear = initEast.year;
viewCalendarMonth = initEast.month;

loop();
</script>
