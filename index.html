<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>東暦標準時時計</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
min-height:100vh;

display:flex;
justify-content:center;
align-items:center;

background:#111;
color:white;

font-family:
-apple-system,
BlinkMacSystemFont,
"SegoeUI",
sans-serif;
}

.container{
width:min(700px,95vw);
text-align:center;
}

h1{
margin-bottom:5px;
}

.subtitle{
color:#aaa;
margin-bottom:25px;
}


/*==============================
時計
==============================*/

.clock{
width:min(500px,85vw);
aspect-ratio:1;

margin:auto;

border:8pxsolid#ddd;
border-radius:50%;

background:#fafafa;
color:#111;

position:relative;

box-shadow:
0030pxrgba(255,255,255,.1);
}


/*==============================
数字
==============================*/

.number{
position:absolute;

width:40px;
height:40px;

display:flex;
align-items:center;
justify-content:center;

font-size:18px;
font-weight:bold;

transform:translate(-50%,-50%);
}


/*==============================
針
==============================*/

.hand{
position:absolute;

left:50%;
bottom:50%;

transform-origin:bottomcenter;

border-radius:10px;

transform:
translateX(-50%)
rotate(0deg);
}

.hour-hand{
width:8px;
height:28%;

background:#222;
}

.minute-hand{
width:5px;
height:38%;

background:#555;
}

.second-hand{
width:2px;
height:43%;

background:red;
}

.center-dot{
position:absolute;

left:50%;
top:50%;

width:15px;
height:15px;

transform:translate(-50%,-50%);

border-radius:50%;

background:red;
}


/*==============================
デジタル
==============================*/

.digital{
font-family:monospace;

font-size:clamp(40px,10vw,80px);

margin:30px010px;
}

.date{
font-size:20px;
}


/*==============================
UI
==============================*/

.controls{
margin-top:30px;

display:flex;
flex-wrap:wrap;

justify-content:center;
gap:10px;
}

select,
button{

padding:10px15px;

border-radius:8px;
border:1pxsolid#555;

background:#222;
color:white;

font-size:15px;

cursor:pointer;
}

.info{
margin-top:20px;

color:#aaa;

line-height:1.7;
}

.hidden{
display:none;
}

</style>
</head>


<body>

<divclass="container">

<h1>東暦標準時</h1>

<divclass="subtitle">
EastCalendarStandardTime
</div>


<!--=========================
アナログ時計
==========================-->

<divid="analog"class="clock">

<divid="hourHand"class="handhour-hand"></div>

<divid="minuteHand"class="handminute-hand"></div>

<divid="secondHand"class="handsecond-hand"></div>

<divclass="center-dot"></div>

</div>


<!--=========================
デジタル時計
==========================-->

<divid="digitalArea">

<divid="digital"class="digital">
00:00:00
</div>

</div>


<divid="date"class="date">
東暦2045年1月1日
</div>


<!--=========================
操作
==========================-->

<divclass="controls">

<selectid="timezone">

<optionvalue="0">
和音陣国—WST±0
</option>

<optionvalue="-2">
日本—WST-2
</option>

<optionvalue="-1">
WST-1
</option>

<optionvalue="1">
WST+1
</option>

<optionvalue="2">
WST+2
</option>

<optionvalue="3">
WST+3
</option>

<optionvalue="4">
WST+4
</option>

<optionvalue="-3">
WST-3
</option>

<optionvalue="-4">
WST-4
</option>

<optionvalue="5">
WST+5
</option>

</select>


<buttonid="modeButton">
デジタル↔アナログ
</button>

</div>


<divid="timezoneInfo"class="info">
</div>

</div>


<script>

/*============================================================
東暦設定
============================================================*/


/*
*このJST時刻が
*
*東暦2045年1月1日00:00:00
*
*に対応する。
*/

constBASE_JST=
newDate("2026-04-19T00:00:00+09:00");


constBASE_YEAR=2045;


/*
*東暦の時間体系
*
*29時間
*145分/時間
*145秒/分
*/

constEAST_HOURS=29;

constEAST_MINUTES=145;

constEAST_SECONDS=145;


/*
*1東暦日
*/

constEAST_SECONDS_PER_DAY=
EAST_HOURS*
EAST_MINUTES*
EAST_SECONDS;


/*
*東暦1日が現実の
*
*25時間31分2秒
*/

constREAL_SECONDS_PER_EAST_DAY=
25*3600+
31*60+
2;


/*
*東暦1時間に対応する経度
*/

constLONGITUDE_PER_HOUR=
360/29;


/*============================================================
暦
============================================================*/

functiondaysInMonth(month){

if(month===6){
return34;
}

return35;
}


functiondaysInYear(){

lettotal=0;

for(
letmonth=1;
month<=15;
month++
){

total+=daysInMonth(month);

}

returntotal;
}


/*============================================================
東暦日時を計算
============================================================*/

functiongetEastDate(now,timezoneOffset){

/*
*重要：
*
*まず「和音陣国WST±0」の東暦時刻を計算する。
*
*ここではWSTを一切使わない。
*
*これによって、
*
*12:34:56
*
*という基準時刻が確定する。
*/

constrealElapsedSeconds=
(
now.getTime()
-
BASE_JST.getTime()
)/1000;


/*
*現実秒→東暦秒
*/

consteastElapsedSeconds=
realElapsedSeconds
*
(
EAST_SECONDS_PER_DAY
/
REAL_SECONDS_PER_EAST_DAY
);


/*
*東暦の日数
*/

lettotalDays=
Math.floor(
eastElapsedSeconds
/
EAST_SECONDS_PER_DAY
);


/*
*その日の中の秒数
*/

letremainingSeconds=
eastElapsedSeconds
-
totalDays*
EAST_SECONDS_PER_DAY;


/*
*年
*/

letyear=BASE_YEAR;


while(
totalDays>=daysInYear()
){

totalDays-=daysInYear();

year++;

}


/*
*月
*/

letmonth=1;


while(
totalDays>=daysInMonth(month)
){

totalDays-=
daysInMonth(month);

month++;

}


/*
*日
*/

letday=
Math.floor(totalDays)+1;


/*
*時
*/

constsecondsPerHour=
EAST_MINUTES*
EAST_SECONDS;


lethour=
Math.floor(
remainingSeconds
/
secondsPerHour
);


remainingSeconds-=
hour*secondsPerHour;


/*
*分
*/

constminute=
Math.floor(
remainingSeconds
/
EAST_SECONDS
);


/*
*秒
*/

constsecond=
Math.floor(
remainingSeconds
%
EAST_SECONDS
);


/*
*秒未満
*/

constsecondFraction=
remainingSeconds
-
Math.floor(remainingSeconds);


/*========================================================
WST適用
========================================================

ここが今回の修正ポイント。

WSTは「時」だけを変える。

分・秒には一切触らない。

例：

WST±0
12:34:56

WST-2
10:34:56

WST+1
13:34:56

となる。
*/

hour+=timezoneOffset;


/*
*29時間制なので、
*0～28の範囲に循環させる。
*/

if(hour<0){

hour+=EAST_HOURS;

day--;

}

if(hour>=EAST_HOURS){

hour-=EAST_HOURS;

day++;

}


/*
*WSTによって日付が変わった場合
*/

if(day<1){

month--;

if(month<1){

month=15;
year--;

}

day=daysInMonth(month);

}


if(
day>
daysInMonth(month)
){

day=1;

month++;

if(month>15){

month=1;
year++;

}

}


return{

year,
month,
day,

hour,
minute,
second,

secondFraction

};

}


/*============================================================
アナログ時計の数字
============================================================*/

constclock=
document.getElementById("analog");


for(
leti=0;
i<EAST_HOURS;
i++
){

constnumber=
document.createElement("div");


number.className="number";


constangle=
i*
360/
EAST_HOURS;


constradius=42;


constx=
50
+
radius*
Math.sin(
angle*Math.PI/180
);


consty=
50
-
radius*
Math.cos(
angle*Math.PI/180
);


number.style.left=
x+"%";


number.style.top=
y+"%";


number.textContent=
i;


clock.appendChild(number);

}


/*============================================================
時計更新
============================================================*/

functionupdateClock(){

constnow=
newDate();


consttimezone=
Number(
document
.getElementById("timezone")
.value
);


consteast=
getEastDate(
now,
timezone
);


/*
*デジタル
*/

document
.getElementById("digital")
.textContent=

String(east.hour)
.padStart(2,"0")

+":"

+String(east.minute)
.padStart(3,"0")

+":"

+String(east.second)
.padStart(3,"0");


/*
*日付
*/

document
.getElementById("date")
.textContent=

`東暦${east.year}年`
+`${east.month}月`
+`${east.day}日`;


/*
*アナログ時計
*/

consthourAngle=(
east.hour
+
east.minute/EAST_MINUTES
+
east.second/
(
EAST_MINUTES*
EAST_SECONDS
)
)
*
360/
EAST_HOURS;


constminuteAngle=

(
east.minute
+
east.second/
EAST_SECONDS
)
*
360/
EAST_MINUTES;


constsecondAngle=

(
east.second
+
east.secondFraction
)
*
360/
EAST_SECONDS;


document
.getElementById("hourHand")
.style.transform=
`translateX(-50%)rotate(${hourAngle}deg)`;


document
.getElementById("minuteHand")
.style.transform=
`translateX(-50%)rotate(${minuteAngle}deg)`;


document
.getElementById("secondHand")
.style.transform=
`translateX(-50%)rotate(${secondAngle}deg)`;


/*
*時差情報
*/

constlongitude=
timezone*
LONGITUDE_PER_HOUR;


/*
*日本はWST-2なので、
*日本との差は
*
*WST-(-2)
*
*となる。
*/

constjapanDifference=
timezone+2;


document
.getElementById("timezoneInfo")
.innerHTML=

`WST${timezone>=0?"+":""}${timezone}`
+
`<br>`
+
`日本との差:`
+
`${japanDifference>=0?"+":""}`
+
`${japanDifference}時間`
+
`<br>`
+
`基準経度との差:`
+
`${longitude.toFixed(3)}°`;

}


/*============================================================
モード切替
============================================================*/

letanalogMode=true;


document
.getElementById("modeButton")
.addEventListener(
"click",
()=>{

analogMode=
!analogMode;


document
.getElementById("analog")
.classList.toggle(
"hidden",
!analogMode
);


document
.getElementById("digitalArea")
.classList.toggle(
"hidden",
analogMode
);

}
);


/*============================================================
時差変更
============================================================*/

document
.getElementById("timezone")
.addEventListener(
"change",
updateClock
);


/*============================================================
更新
============================================================*/

functionloop(){

updateClock();

requestAnimationFrame(loop);

}


loop();

</script>

</body>
</html>
